name: "Thread CoAP Bridge"
version: "0.1.0"
slug: "thread_coap_bridge"
description: "Bridge CoAP devices on Thread network to Home Assistant via MQTT"
url: "https://github.com/yourusername/ha-addon-thread-coap-bridge"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto

# Host network access required for IPv6 multicast
host_network: true

# Capabilities needed for raw socket access
privileged:
  - NET_ADMIN
  - NET_RAW

# Services this add-on depends on
services:
  - mqtt:need

# Default configuration
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "homeassistant"
  mqtt_password: ""
  discovery_interval: 60
  log_level: "info"
  thread_interface: "wpan0"
  multicast_address: "ff03::fd"

# Configuration schema (validated by Home Assistant)
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  discovery_interval: int(30,300)
  log_level: list(debug|info|warning|error)
  thread_interface: str
  multicast_address: str

# Persistent data directories
map:
  - config:rw
  - share:rw
  - ssl:ro

# Enable Home Assistant API access
homeassistant_api: true

# Container image (update with your GitHub username)
image: "ghcr.io/{arch}-addon-thread-coap-bridge"
