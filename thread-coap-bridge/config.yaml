name: "Thread CoAP Bridge"
version: "0.1.0"
slug: "thread_coap_bridge"
description: "Bridge CoAP devices on Thread network to Home Assistant via MQTT"
url: "https://github.com/Rosfly/thread-coap-bridge-addon"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
host_network: true

stdin: true
tty: true

services:
  - mqtt:need

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "homeassistant"
  mqtt_password: ""
  discovery_interval: 60
  log_level: "info"
  thread_interface: "wpan0"
  multicast_address: "ff03::fd"

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  discovery_interval: int(30,300)
  log_level: list(debug|info|warning|error)
  thread_interface: str
  multicast_address: str

map:
  - config:rw
  - share:rw
  - ssl:ro

homeassistant_api: true
